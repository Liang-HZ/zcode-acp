name: Publish to PyPI

# Trusted publishing (OIDC) — no API tokens anywhere.
# PyPI side already has the pending publisher:
#   project zcode-acp  ←  Liang-HZ/zcode-acp  ·  workflow publish.yml  ·  env (Any)
# First successful run creates the project; later GitHub releases auto-publish.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  pypi:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC token for the publish step
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build sdist + wheel
        run: |
          python -m pip install --quiet build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
